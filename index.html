function biomeAt(px, biomes) {
  const list = biomes || BIOMES1;
  const col = Math.floor(px / TILE);
  return list.find((b) => col <= b.end) || list[list.length - 1];
}
function biomeAtRow(py, biomes) {
  const row = Math.floor(py / TILE);
  return biomes.find((b) => row <= b.end) || biomes[biomes.length - 1];
}
function zoneFor(world, px, py) {
  return world.zoneAxis === "row" ? biomeAtRow(py, world.biomes) : biomeAt(px, world.biomes);
}

function emptyGrid(w, h) { return Array.from({ length: h }, () => Array.from({ length: w }, () => ".")); }
function setPx(g, c, r, ch) { if (r >= 0 && r < g.length && c >= 0 && c < g[0].length) g[r][c] = ch; }
function buildBlob(w, h, rx, ry, body, dark, hi) {
  const g = emptyGrid(w, h);
  const cx = (w - 1) / 2, cy = (h - 1) / 2;
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++) {
      const dx = (c - cx) / rx, dy = (r - cy) / ry, d = dx * dx + dy * dy;
      if (d <= 1) {
        let ch = body;
        if (dy > 0.30) ch = dark;
        if (dx < -0.05 && dy < -0.05 && d < 0.55) ch = hi;
        g[r][c] = ch;
      }
    }
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++) {
      if (g[r][c] === ".") continue;
      const nb = [[c - 1, r], [c + 1, r], [c, r - 1], [c, r + 1]];
      if (nb.some(([nc, nr]) => nc < 0 || nr < 0 || nc >= w || nr >= h || g[nr][nc] === ".")) {
      
      }
    }
  const out = g.map((row) => row.slice());
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++) {
      if (g[r][c] === ".") continue;
      const nb = [[c - 1, r], [c + 1, r], [c, r - 1], [c, r + 1]];
      if (nb.some(([nc, nr]) => nc < 0 || nr < 0 || nc >= w || nr >= h || g[nr][nc] === ".")) out[r][c] = "O";
    }
  return out;
}
function makeSprite(grid, pal) {
  const h = grid.length, w = grid[0].length;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const x = cv.getContext("2d");
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++) {
      const ch = grid[r][c];
      if (ch === ".") continue;
      x.fillStyle = pal[ch] || "#f0f";
      x.fillRect(c, r, 1, 1);
    }
  return { cv, w, h };
}
function drawSprite(ctx, spr, x, y, flip, sx = 1, sy = 1) {
  const w = spr.w, h = spr.h, dw = w * sx, dh = h * sy;
  const ox = Math.round(x + (w - dw) / 2);
  const oy = Math.round(y + (h - dh)); 
  ctx.save();
  if (flip) { ctx.translate(ox + dw, oy); ctx.scale(-1, 1); ctx.drawImage(spr.cv, 0, 0, dw, dh); }
  else ctx.drawImage(spr.cv, ox, oy, dw, dh);
  ctx.restore();
}


const PATHO_PAL = {
  O: "#1e3214", b: "#79c64e", d: "#4f9633", h: "#a9e873", H: "#d6ff9e",
  c: "#46c7d6", C: "#a6f2fb", e: "#f2fde6", p: "#1e3214", s: "#ffffff", m: "#a23b4a",

function pathoFrame(spikePhase, foot, blink) {
  const g = buildBlob(15, 14, 6.6, 5.7, "b", "d", "h");

  setPx(g, 4, 2, "H"); setPx(g, 5, 2, "H"); setPx(g, 3, 3, "H");

  const spikes = [[7, 0], [4, 1], [10, 1], [1, 5], [13, 5], [2, 9], [12, 9], [7, 13]];
  spikes.forEach(([c, r], i) => { if ((i + spikePhase) % 2 === 0) { setPx(g, c, r, "c"); } });

  if (blink) { [[4, 6], [5, 6], [9, 6], [10, 6]].forEach(([c, r]) => setPx(g, c, r, "O")); }
  else {
    [[4, 5], [5, 5], [4, 6], [5, 6]].forEach(([c, r]) => setPx(g, c, r, "e"));
    [[9, 5], [10, 5], [9, 6], [10, 6]].forEach(([c, r]) => setPx(g, c, r, "e"));
    setPx(g, 5, 6, "p"); setPx(g, 10, 6, "p");
    setPx(g, 4, 5, "s"); setPx(g, 9, 5, "s");
  }

  setPx(g, 6, 9, "m"); setPx(g, 7, 9, "m"); setPx(g, 8, 9, "m"); setPx(g, 5, 8, "m"); setPx(g, 9, 8, "m");

  if (foot === 0) { setPx(g, 5, 13, "O"); setPx(g, 9, 13, "O"); }
  else if (foot === 1) { setPx(g, 4, 13, "O"); setPx(g, 8, 13, "O"); }
  else { setPx(g, 6, 13, "O"); setPx(g, 10, 13, "O"); }
  return g;
}

const NEUT_PAL = { O: "#5a4a25", b: "#f3e6b8", d: "#dcc88c", h: "#fdf6da", n: "#7a4fa0", N: "#9a6fc0", G: "#d49a52", e: "#352510", p: "#150f06" };

const RETIC_PAL = { O: "#5a4470", b: "#cdb8ec", d: "#a48bd4", h: "#ece0ff", e: "#3a2a52", p: "#241a38", n: "#f4eaff" };
function buildStellate(w, h, body, dark, hi, arm, phase = 0, reach = 1) {
  const g = buildBlob(w, h, w * 0.26, h * 0.26, body, dark, hi);
  const cx = (w - 1) / 2, cy = (h - 1) / 2;

  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.3 + phase;
    const len = Math.max(w, h) * 0.62 * reach;
    for (let t = 2; t < len; t += 1) {
      const x = Math.round(cx + Math.cos(a) * t), y = Math.round(cy + Math.sin(a) * t * 0.92);
      setPx(g, x, y, arm);
      if (t % 3 === 0) setPx(g, x + (Math.cos(a) >= 0 ? 1 : -1), y, arm);
    }
  }
  return g;
}
function reticularGrid() {
  const g = buildStellate(20, 18, "b", "d", "h", "O");
  const cx = 9, cy = 8;
  setPx(g, cx, cy, "e"); setPx(g, cx + 1, cy, "e"); setPx(g, cx, cy + 1, "e");
  setPx(g, cx - 1, cy - 1, "n"); setPx(g, cx + 2, cy - 1, "n");
  return g;
}

function heartPath(ctx, cx, cy, s) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.3);
  ctx.bezierCurveTo(cx - s, cy - s * 0.4, cx - s * 0.55, cy - s, cx, cy - s * 0.45);
  ctx.bezierCurveTo(cx + s * 0.55, cy - s, cx + s, cy - s * 0.4, cx, cy + s * 0.3);
  ctx.closePath();
}

function drawGlow(ctx, x, y, r, color, a) {
  ctx.save();
  ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawFlagellum(ctx, x, y, facing, t) {
  ctx.strokeStyle = "#46c7d6";
  ctx.lineWidth = 1;
  ctx.beginPath();
  const dir = -facing;
  for (let i = 0; i <= 8; i++) {
    const px = x + dir * i;
    const py = y + Math.sin(t * 8 + i * 0.8) * (i * 0.35);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawMacrophage(ctx, x, y, r, t, facing) {
  drawGlow(ctx, x, y, r + 8, "rgba(150,120,200,0.5)", 0.5);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#9a86c4";
  const arms = 11;
  for (let i = 0; i < arms; i++) {
    const a = (i / arms) * Math.PI * 2 + t * 0.5;
    const rr = r + 2 + Math.sin(t * 2.2 + i) * 2.2;

function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function isSolid(world, c, r) {
  if (world.solid.has(c * 1000 + r)) return true;
  const g = world.gate;
  if (g && !g.open && c === g.c0 && r >= g.r0 && r <= g.r1) return true;
  if (world.gates) {
    for (const gg of world.gates) if (!gg.open && c === gg.c0 && r >= gg.r0 && r <= gg.r1) return true;
  }
  if (world.exitGate && !world.exitGate.open && c === world.exitGate.c0 && r >= world.exitGate.r0 && r <= world.exitGate.r1) return true;
  return false;
}

/* ---------- SAVED PROGRESS -------------------------------------------
   A run itself always starts fresh (see world-select copy), but a
   completed run (reaching the true ending in World 3) is worth
   remembering across sessions — best ATP haul and how many times the
   player has finished. Stored as plain JSON in localStorage; every call
   is wrapped since private-browsing / storage-disabled contexts throw
   on access, not just on write. */
const PROGRESS_KEY = "rbg_progress_v1";
function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return { bestAtp: 0, bestTotal: 0, completions: 0, lastAtp: 0, lastPlayedAt: null };
    const p = JSON.parse(raw);
    return {
      bestAtp: p.bestAtp || 0, bestTotal: p.bestTotal || 0, completions: p.completions || 0,
      lastAtp: p.lastAtp || 0, lastPlayedAt: p.lastPlayedAt || null,
    };
  } catch (e) { return { bestAtp: 0, bestTotal: 0, completions: 0, lastAtp: 0, lastPlayedAt: null }; }
}
function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
}

/* ---------- CRASH RECOVERY ---------------------------------------------
   A single uncaught exception anywhere in the game (physics, rendering,
   a dialogue/quiz state machine, ...) would otherwise unmount the whole
   React tree and leave a blank white page with no explanation. This
   catches that at the root and swaps in a recoverable screen instead —
   styled like the existing CDN-load-failure guard in <head>, since a
   React error boundary can't reach JSX/styles defined inside the tree
   it's protecting. Best-run progress lives in localStorage (see
   loadProgress/saveProgress above), so it survives the crash either way. */
class GameCrashBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { crashed: false };
  }
  static getDerivedStateFromError() {
    return { crashed: true };
  }
  componentDidCatch(error, info) {
    console.error("Game crashed:", error, info);
  }
  render() {
    if (this.state.crashed) {
      return (
        <div style={{
          fontFamily: "monospace", color: "#e8c0cf", padding: 48, textAlign: "center",
          background: "#0a040e", minHeight: "100vh", display: "flex", alignItems: "center",
          justifyContent: "center", flexDirection: "column", boxSizing: "border-box",
        }}>
          <div style={{ fontSize: 20, color: "#e8556a", marginBottom: 16 }}>⚠ SOMETHING BROKE</div>
          <div style={{ fontSize: 13, lineHeight: 2, maxWidth: 440 }}>
            The game hit an unexpected error and had to stop.<br />
            Your best-run progress is saved and won't be lost.
          </div>
          <button
            onClick={() => window.location.reload()}
            style={{
              marginTop: 20, fontFamily: "monospace", fontSize: 13, color: "#1a1206",
              background: "linear-gradient(180deg,#ffd34d,#e0a82e)", border: "2px solid #8a6418",
              borderRadius: 6, padding: "12px 20px", cursor: "pointer",
            }}
          >
            RELOAD
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

        // pulsing arrow above the closed-tube entrance (col 70, row 12) while RBC 3 is uncollected
        if (!world.rbcs[2].got) {
          const arrowX = 70 * TILE + TILE / 2 - cam, arrowY = 12 * TILE - camY - 6;
          if (arrowX > -10 && arrowX < VW + 10) {
            const pulse = 0.45 + Math.abs(Math.sin(s.t * 3.5)) * 0.55;
            gctx.save(); gctx.globalAlpha = pulse;
            gctx.fillStyle = "#e8556a";
            gctx.beginPath();
            gctx.moveTo(arrowX, arrowY + 7);
            gctx.lineTo(arrowX - 5, arrowY);
            gctx.lineTo(arrowX + 5, arrowY);
            gctx.closePath(); gctx.fill();
            gctx.restore();
          }
        }
        const g = world.gate;
        const gx = g.c0 * TILE - cam, gyTop = g.r0 * TILE - camY, gh = (g.r1 - g.r0 + 1) * TILE;
        if (gx > -TILE && gx < VW + TILE) drawHEVGate(gctx, gx, gyTop, gh, s.t, g.open);
        if (world.subPortal) {
          const spx = world.subPortal.x - cam, spy = world.subPortal.y - camY;
          if (spx > -20 && spx < VW + 20) drawPortal(gctx, spx, spy, s.t, "rgba(255,211,120,0.6)", "#ffe9a8", "#e0b84f", "#a8853f");
        }
      }

      if (s.worldId === "sub3") {
        for (const ch of world.chambers) {
          const prx = ch.presenter.x - cam, pry = ch.presenter.y - camY;
          if (prx > -30 && prx < VW + 30) {
            if (ch.presenter.type === "cancer") drawSprite(gctx, SPR.cancer, prx, pry, false);
            else drawMacrophage(gctx, prx, pry, 13, s.t, 1);
          }
          const rx = ch.receiver.x - cam, ry = ch.receiver.y - camY;
          if (rx > -20 && rx < VW + 20) drawTcell(gctx, rx, ry, s.t, ch.progress / ch.order.length);
          const dx = ch.dockX - cam, dy = ch.dockY - camY;
          if (dx > -20 && dx < VW + 20) {
            for (let i = 0; i < ch.order.length; i++) {
              const a = (i / ch.order.length) * Math.PI * 2 - Math.PI / 2;
              const px = dx + Math.cos(a) * 10, py = dy + Math.sin(a) * 8;
              const lit = i < ch.progress;
              gctx.save();
              gctx.globalAlpha = lit ? 0.95 : 0.35;
              gctx.fillStyle = lit ? MARKER_DEFS[ch.order[i]].color : "#665566";
              gctx.beginPath(); gctx.arc(px, py, 2.4, 0, Math.PI * 2); gctx.fill();
              gctx.restore();
            }
          }
        }
        for (const m of world.markers) {
          if (m.got) continue;
          if (m.x - cam < -14 || m.x - cam > VW + 14) continue;
          drawMarkerPip(gctx, m.x - cam, m.y - camY, s.t, MARKER_DEFS[m.key]);
        }
        for (const gg of world.gates) {
          const ggx = gg.c0 * TILE - cam, ggyTop = gg.r0 * TILE - camY, ggh = (gg.r1 - gg.r0 + 1) * TILE;
          if (ggx > -TILE && ggx < VW + TILE) drawHEVGate(gctx, ggx, ggyTop, ggh, s.t, gg.open);
        }
        const gc = world.gc;
        if (!gc.antigen.got) {
          const gax = gc.antigen.x - cam, gay = gc.antigen.y - camY;
          if (gax > -10 && gax < VW + 10) drawAntigen(gctx, gax, gay, s.t, ANTIGEN_TYPES[0]);
        }
        const bx = gc.bCell.x - cam, by = gc.bCell.y - camY;
        if (bx > -20 && bx < VW + 20) drawSprite(gctx, SPR.bcell, bx, by, false);
        const hx = gc.helper.x - cam, hy = gc.helper.y - camY;
        if (hx > -20 && hx < VW + 20) drawTcell(gctx, hx, hy, s.t, gc.progress / gc.order.length);
        if (gc.stage === "await_dock") {
          const ddx = ((gc.bCell.x + gc.helper.x) / 2) - cam, ddy = ((gc.bCell.y + gc.helper.y) / 2) - camY;
          for (let i = 0; i < gc.order.length; i++) {
            const a = (i / gc.order.length) * Math.PI * 2 - Math.PI / 2;
            const px = ddx + Math.cos(a) * 10, py = ddy + Math.sin(a) * 8;
            const lit = i < gc.progress;
            gctx.save(); gctx.globalAlpha = lit ? 0.95 : 0.35;
            gctx.fillStyle = lit ? MARKER_DEFS[gc.order[i]].color : "#665566";
            gctx.beginPath(); gctx.arc(px, py, 2.4, 0, Math.PI * 2); gctx.fill(); gctx.restore();
          }
        }
        if (gc.stage === "done" && gc.plasma) drawPlasmaCell(gctx, gc.plasma.x - cam, gc.plasma.y - camY, gc.plasma.t, -1);
        const eg = world.exitGate;
        const egx = eg.c0 * TILE - cam, egyTop = eg.r0 * TILE - camY, egh = (eg.r1 - eg.r0 + 1) * TILE;
        if (egx > -TILE && egx < VW + TILE) drawHEVGate(gctx, egx, egyTop, egh, s.t, eg.open);
      }

      // npcs
      const npcList = world.npcs || [world.npc];
      for (const npc of npcList) {
        const nx = npc.x - cam, ny = npc.y - camY;
        if (nx > -20 && nx < VW + 20 && ny > -20 && ny < VH + 20) {
          const bob = Math.round(Math.sin(s.t * 2 + npc.x * 0.02) * 1);
          if (npc.decor === "antibody") drawAntibody(gctx, nx + 8, ny - 10 + bob, s.t);
          drawSprite(gctx, SPR[npc.sprite], nx, ny + bob, false);
        }
      }

      if (s.worldId === 2) {
        for (const a of world.antigens) {
          if (a.got) continue;
          if (a.x - cam < -10 || a.x - cam > VW + 10) continue;
          drawAntigen(gctx, a.x - cam, a.y - camY, s.t, ANTIGEN_TYPES[a.type]);
        }
        for (const f of world.fdcs) {
          if (f.x - cam < -26 || f.x - cam > VW + 26) continue;
          drawFDC(gctx, f.x - cam, f.y - camY, s.t, ANTIGEN_TYPES[f.type].color, f.delivered);
        }
        for (const hev of world.hevs) {
          if (hev.x - cam < -16 || hev.x - cam > VW + 16) continue;
          drawHEV(gctx, hev.x - cam, hev.yTop - camY, hev.h, s.t, hev.touched);
        }
        for (const pl of world.plasmas) {
          if (pl.x - cam < -20 || pl.x - cam > VW + 20) continue;
          drawPlasmaCell(gctx, pl.x - cam, pl.y - camY, pl.t, Math.sin(pl.t) >= 0 ? 1 : -1);
        }
      }

      {
        const ex = world.exit;
        if (ex.x - cam > -30 && ex.x - cam < VW + 30) {
          const isPortal = ex.kind === "portal";
          const locked = s.worldId === 3 && !ex.active;
          if (locked) {
            // Sealed exit — dim pulsing ring to hint "something is here"
            const sx = ex.x - cam, sy = ex.y - camY;
            drawGlow(gctx, sx, sy, 12, "rgba(100,120,160,0.3)", 0.25 + Math.sin(s.t * 2) * 0.12);
            gctx.save();
            gctx.globalAlpha = 0.38 + Math.sin(s.t * 2.5) * 0.1;
            gctx.strokeStyle = "#6688aa"; gctx.lineWidth = 2;
            gctx.beginPath(); gctx.arc(sx, sy, 8, 0, Math.PI * 2); gctx.stroke();
            gctx.fillStyle = "#3a4a5a";
            gctx.beginPath(); gctx.arc(sx, sy, 4, 0, Math.PI * 2); gctx.fill();
            gctx.restore();
          } else {
            const glow = isPortal ? "rgba(170,140,255,0.7)" : "rgba(140,210,255,0.7)";
            const fillA = isPortal ? "#cfa6f2" : "#a6d8f2";
            const fillB = isPortal ? "#9a78cf" : "#6fa8c8";
            const ring = isPortal ? "#7a5cb0" : "#4f7a98";
            drawPortal(gctx, ex.x - cam, ex.y - camY, s.t, glow, fillA, fillB, ring);
            gctx.globalAlpha = 1;
          }
        }
      }

      for (const e of world.enemies) {
        const sx = (e.type === "neut" ? e.x : e.x) - cam;
        if (sx < -44 || sx > VW + 44) continue;
        if (e.type === "macro") drawMacrophage(gctx, e.x - cam, e.y - camY, e.r, e.t, e.facing);
        else if (e.type === "neut") {
          if (e.chase) { gctx.fillStyle = "#ffe25a"; gctx.fillRect(e.x - cam + 9, e.y - camY - 6, 1, 3); gctx.fillRect(e.x - cam + 9, e.y - camY - 2, 1, 1); }
          drawSprite(gctx, SPR.neut[Math.floor(e.t * 6) % 2], e.x - cam, e.y - camY, e.facing < 0);
        } else drawTcell(gctx, e.x - cam, e.y - camY, e.t, e.charge);
      }
      for (const k of world.cytokines) {
        if (k.x - cam < -10 || k.x - cam > VW + 10) continue;
        if (k.ab) drawAntibody(gctx, k.x - cam, k.y - camY, k.t);
        else if (k.il) drawFactor(gctx, k.x - cam, k.y - camY, k.t, k.il.color);
        else drawCytokine(gctx, k.x - cam, k.y - camY, k.t);
      }
      for (const ab of world.antibodies) { if (ab.x - cam < -20 || ab.x - cam > VW + 20) continue; drawAntibody(gctx, ab.x - cam, ab.y - camY, ab.t); }

      // player
      let spr;
      if (!p.onGround) spr = SPR.jump;
      else if (Math.abs(p.vx) > 0.3) spr = SPR.run[Math.floor(p.anim) % 2];
      else spr = p.blink > 214 ? SPR.blink : SPR.idle[Math.floor(s.t * 2) % 2];
      let sx = 1, sy = 1;
      if (p.land > 0) { const k = p.land / 8; sx = 1 + 0.28 * k; sy = 1 - 0.26 * k; }
      else if (!p.onGround) { sy = 1 + Math.max(-0.12, Math.min(0.18, -p.vy * 0.03)); sx = 2 - sy; }
      const flicker = p.invuln > 0 && Math.floor(s.t * 20) % 2 === 0;
      if (!flicker) {
        drawGlow(gctx, p.x - cam + p.w / 2, p.y - camY + p.h / 2, 14, "rgba(140,240,110,0.5)", 0.4);
        drawFlagellum(gctx, p.x - cam + p.w / 2, p.y - camY + p.h * 0.7, p.facing, s.t);

      }

      // particles
      for (const pa of s.particles) { gctx.globalAlpha = Math.max(0, pa.life / pa.max); gctx.fillStyle = pa.color; gctx.fillRect(Math.round(pa.x - cam), Math.round(pa.y - camY), pa.size, pa.size); }
      gctx.globalAlpha = 1;

      if (s.worldId === 2 && p.carry != null) {
        drawAntigen(gctx, p.x - cam + p.w / 2, p.y - camY - 10 + Math.sin(s.t * 3) * 2, s.t, ANTIGEN_TYPES[p.carry]);
      }
      if (s.worldId === 3 && p.carry === "rbc") {
        drawRBC(gctx, p.x - cam + p.w / 2, p.y - camY - 10 + Math.sin(s.t * 3) * 2, s.t);
      }

      // vignette
      const vg = gctx.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 175);

      gctx.fillStyle = vg; gctx.fillRect(0, 0, VW, VH);

      // damage edge flash
      if (s.hitFlash > 0) {
        const fa = (s.hitFlash / 14) * 0.6;
        const fg2 = gctx.createRadialGradient(VW / 2, VH / 2, 22, VW / 2, VH / 2, VH * 0.95);
        fg2.addColorStop(0, "rgba(232,85,106,0)");
        fg2.addColorStop(0.55, "rgba(232,85,106," + (fa * 0.25) + ")");
        fg2.addColorStop(1, "rgba(232,85,106," + fa + ")");
        gctx.fillStyle = fg2; gctx.fillRect(0, 0, VW, VH);
      }
    };

    const renderText = () => {
      s = stateRef.current;
      tctx.clearRect(0, 0, TW, TH);
      if (modeRef.current === "secret" || modeRef.current === "mastquiz") return;
      const { world } = s, p = s.player, cam = s.cam, camY = s.camY || 0;
      const wx = (x) => (x - cam) * S, wy = (y) => (y - camY) * S;


      tctx.textAlign = "center"; tctx.textBaseline = "alphabetic";
      tctx.font = "22px 'VT323', monospace";
      const labelFor = (e, name, topY) => {
        const lx = wx(e.x + (e.type === "neut" ? e.w / 2 : 0)), ly = wy(topY) - 8;
        if (lx < -60 || lx > TW + 60) return;
        const near = Math.abs(e.x - (p.x + p.w / 2)) < 70 && Math.abs(e.y - p.y) < 70;
        tctx.globalAlpha = near ? 0.95 : 0.32;
        tctx.fillStyle = "#0a0a12"; tctx.fillText(name, lx + 1, ly + 1);
        tctx.fillStyle = near ? "#ffe9a8" : "#e7d4dd"; tctx.fillText(name, lx, ly);
      };
      for (const e of world.enemies) {
        if (e.type === "macro") labelFor(e, "Macrophage", e.y - e.r - 2);
        else if (e.type === "neut") labelFor(e, "Neutrophil", e.y - 4);
        else labelFor(e, "T-Cell", e.y - 14);
      }
      if (s.worldId === 1 && !world.mast.triggered) {
        labelFor({ x: world.mast.x, y: world.mast.y, type: "" }, "Mast Cell", world.mast.y - 4);
      }
      if (s.worldId === 2) {
        for (const f of world.fdcs) labelFor(f, "Follicular DC", f.y - 14);
        for (const pl of world.plasmas) labelFor(pl, "Plasma Cell", pl.y - 14);
        for (const hev of world.hevs) labelFor({ x: hev.x + 4, type: "" }, "HEV", hev.yTop - 4);
      }
      if (s.worldId === 3) {
        const g = world.gate;
        labelFor({ x: g.c0 * TILE + 8, y: 19 * TILE, type: "" }, g.open ? "HEV \u2014 open" : "HEV \u2014 closed", 19 * TILE - 4);
        if (world.subPortal) {
          labelFor({ x: world.subPortal.x, y: world.subPortal.y, type: "" }, "??? \u2014 hidden passage", world.subPortal.y - 4);
        }
      }

      {
        const npcList = world.npcs || [world.npc];
        for (const npc of npcList) {
          const lx = wx(npc.x + 8), ly = wy(npc.y) - 12;
          if (lx < -60 || lx > TW + 60) continue;
          tctx.globalAlpha = 0.85; tctx.fillStyle = "#0a0a12"; tctx.fillText(npc.name, lx + 1, ly + 1);
          tctx.fillStyle = "#aef0ff"; tctx.fillText(npc.name, lx, ly);
        }
      }

      if (s.worldId === "sub3") {
        const stations = [];
        for (const ch of world.chambers) { stations.push(ch.presenter); stations.push(ch.receiver); }
        stations.push(world.gc.bCell, world.gc.helper);
        for (const st of stations) {
          const lx = wx(st.x + 8), ly = wy(st.y) - 12;
          if (lx < -60 || lx > TW + 60) continue;
          tctx.globalAlpha = 0.85; tctx.fillStyle = "#0a0a12"; tctx.fillText(st.label, lx + 1, ly + 1);
          tctx.fillStyle = "#ffe9a8"; tctx.fillText(st.label, lx, ly);
        }
        tctx.globalAlpha = 1;

        // name tag above every uncollected marker — know what it is before
        // you pick it up, not just after (via the carry HUD line)
        tctx.textAlign = "center"; tctx.font = "14px 'VT323', monospace";
        for (const m of world.markers) {
          if (m.got) continue;
          if (m.zone === 2 && world.gc.stage !== "await_dock") continue;
          // skip the name tag when the guide arrow is already pointing at
          // this exact marker — avoids stacking two copies of the same text
          if (s.objective && s.objective.x === m.x && s.objective.y === m.y) continue;
          const lx = wx(m.x), ly = wy(m.y) - 16;
          if (lx < -60 || lx > TW + 60) continue;
          const def = MARKER_DEFS[m.key];
          tctx.globalAlpha = 0.9; tctx.fillStyle = "#0a0a12"; tctx.fillText(def.name, lx + 1, ly + 1);
          tctx.fillStyle = def.color; tctx.fillText(def.name, lx, ly);
        }
        tctx.globalAlpha = 1;

        // persistent recipe card above each incomplete dock — the required
        // order stays readable at all times, not just after a wrong delivery
        const drawRecipe = (dockX, dockY, order, progress) => {
          const lx = wx(dockX);
          if (lx < -110 || lx > TW + 110) return;
          const topY = wy(dockY) - 46 - order.length * 15;
          tctx.font = "13px 'VT323', monospace";
          order.forEach((key, i) => {
            const done = i < progress, current = i === progress;
            const line = (done ? "✓ " : current ? "▶ " : "• ") + MARKER_DEFS[key].name;
            const yy = topY + i * 15;
            tctx.globalAlpha = current ? 1 : 0.75;
            tctx.fillStyle = "#0a0a12"; tctx.fillText(line, lx + 1, yy + 1);
            tctx.fillStyle = done ? "#9fe06a" : current ? "#ffe07a" : "rgba(244,234,208,0.6)";
            tctx.fillText(line, lx, yy);
          });
          tctx.globalAlpha = 1;
        };
        for (const ch of world.chambers) if (!ch.complete) drawRecipe(ch.dockX, ch.dockY, ch.order, ch.progress);
        if (world.gc.stage === "await_dock") {
          drawRecipe((world.gc.bCell.x + world.gc.helper.x) / 2, (world.gc.bCell.y + world.gc.helper.y) / 2, world.gc.order, world.gc.progress);
        }
        tctx.font = "22px 'VT323', monospace";
      }

      {
        const ex = world.exit;

        const exitLocked = s.worldId === 3 && !ex.active;

        const exitColor = exitLocked ? "rgba(100,120,180,0.7)" : "#ffc6dd";
        tctx.globalAlpha = exitLocked ? 0.55 : 0.9;

        tctx.fillStyle = "#0a0a12"; tctx.fillText(exitLabel, lx + 1, ly + 1);
        tctx.fillStyle = exitColor; tctx.fillText(exitLabel, lx, ly);
        tctx.font = "22px 'VT323', monospace";

      tctx.globalAlpha = 1;

  
      if (s.objective) {
        const obj = s.objective;
        const ox = wx(obj.x), oy = wy(obj.y);
        const margin = 36;
        const onScreen = ox > margin && ox < TW - margin && oy > margin && oy < TH - margin;
        let ax, ay, angle;
        if (onScreen) {
          ax = ox; ay = oy - 38 - Math.sin(s.t * 4) * 5; angle = Math.PI / 2;
        } else {
          const cx = TW / 2, cy = TH / 2;
          const pos = edgeArrowPos(cx, cy, ox - cx, oy - cy, TW, TH, margin);
          ax = pos.x; ay = pos.y; angle = Math.atan2(oy - cy, ox - cx);
        }
        drawPointerArrow(tctx, ax, ay, angle, "#ffe07a");
        tctx.font = "16px 'Press Start 2P', monospace"; tctx.textAlign = "center";
        const ly2 = onScreen ? ay - 18 : ay + (Math.sin(angle) >= 0 ? 30 : -22);
        tctx.fillStyle = "#0a0a12"; tctx.fillText(obj.label, ax + 1, ly2 + 1);
        tctx.fillStyle = "#ffe07a"; tctx.fillText(obj.label, ax, ly2);
        tctx.textAlign = "center";
      }

      // +1 score popups
      if (s.scorePopups.length > 0) {
        tctx.font = "26px 'VT323', monospace"; tctx.textAlign = "center";
        for (const sp of s.scorePopups) {
          const a = sp.life / sp.max;
          const spx = (sp.x - cam) * S, spy = (sp.y - camY) * S;
          if (spx < -30 || spx > TW + 30) continue;
          tctx.globalAlpha = a;
          tctx.fillStyle = "#0a0a12"; tctx.fillText("+1", spx + 2, spy + 2);
          tctx.fillStyle = "#ffd34d"; tctx.fillText("+1", spx, spy);
        }
        tctx.globalAlpha = 1;
      }

      // ---- HUD ----
      // arcade-style HUD panels
      tctx.save();
      tctx.globalAlpha = 0.62;
      tctx.fillStyle = "#0a040e";
      tctx.fillRect(10, 10, 216, 84);
      tctx.fillRect(TW - 214, 10, 204, 58);
      tctx.globalAlpha = 0.45;
      tctx.strokeStyle = "#5a3a58";
      tctx.lineWidth = 2;
      tctx.strokeRect(10, 10, 216, 84);
      tctx.strokeRect(TW - 214, 10, 204, 58);
      // pixel corner accents — top-left panel
      tctx.fillStyle = "#9fe06a"; tctx.globalAlpha = 0.7;
      tctx.fillRect(10, 10, 6, 2); tctx.fillRect(10, 10, 2, 6);
      tctx.fillRect(220, 10, 6, 2); tctx.fillRect(224, 10, 2, 6);
      tctx.fillRect(10, 92, 6, 2); tctx.fillRect(10, 88, 2, 6);
      tctx.fillRect(220, 92, 6, 2); tctx.fillRect(224, 88, 2, 6);
      // pixel corner accents — ATP panel
      tctx.fillRect(TW - 214, 10, 6, 2); tctx.fillRect(TW - 214, 10, 2, 6);
      tctx.fillRect(TW - 12, 10, 6, 2); tctx.fillRect(TW - 10, 10, 2, 6);
      tctx.fillRect(TW - 214, 66, 6, 2); tctx.fillRect(TW - 214, 62, 2, 6);
      tctx.fillRect(TW - 12, 66, 6, 2); tctx.fillRect(TW - 10, 62, 2, 6);
      tctx.restore();
      // hearts
      for (let i = 0; i < 3; i++) {
        const hx = 36 + i * 52, hy = 40, sz = 17;
        tctx.lineWidth = 4; tctx.strokeStyle = "#2a0e16";
        heartPath(tctx, hx, hy, sz); tctx.stroke();
        if (i < p.hearts) { tctx.fillStyle = "#e8556a"; heartPath(tctx, hx, hy, sz); tctx.fill(); tctx.fillStyle = "rgba(255,255,255,0.5)"; tctx.fillRect(hx - sz * 0.5, hy - sz * 0.45, 5, 5); }
        else { tctx.fillStyle = "#4a2a34"; heartPath(tctx, hx, hy, sz); tctx.fill(); }
      }
      // ATP
      tctx.textAlign = "right"; tctx.font = "34px 'VT323', monospace";
      tctx.fillStyle = "#0a0a12"; tctx.fillText("ATP " + s.atp, TW - 24 + 2, 52 + 2);
      tctx.fillStyle = "#ffd34d"; tctx.fillText("ATP " + s.atp, TW - 24, 52);
      // biome / zone
      const biome = zoneFor(world, cam + VW / 2, camY + VH / 2);
      tctx.textAlign = "center"; tctx.font = "32px 'VT323', monospace";
      tctx.fillStyle = "#0a0a12"; tctx.fillText(biome.name, TW / 2 + 2, 46 + 2);
      tctx.fillStyle = "rgba(244,234,208,0.92)"; tctx.fillText(biome.name, TW / 2, 46);
      // world indicator (top-left, below hearts)
      tctx.textAlign = "left"; tctx.font = "20px 'Press Start 2P', monospace";
      const worldLabel = "WORLD " + s.worldId;
      tctx.fillStyle = "#0a0a12"; tctx.fillText(worldLabel, 24 + 1, 82 + 1);
      tctx.fillStyle = "rgba(244,234,208,0.7)"; tctx.fillText(worldLabel, 24, 82);
      // carried-item readout
      if (s.worldId === 2 && p.carry != null) {
        const at = ANTIGEN_TYPES[p.carry];
        tctx.font = "22px 'VT323', monospace";
        tctx.fillStyle = "#0a0a12"; tctx.fillText("Carrying: " + at.name, 24 + 1, 110 + 1);
        tctx.fillStyle = at.color; tctx.fillText("Carrying: " + at.name, 24, 110);
      }
      if (s.worldId === 3 && p.carry === "rbc") {
        tctx.font = "22px 'VT323', monospace";
        tctx.fillStyle = "#0a0a12"; tctx.fillText("Carrying: Senescent RBC", 24 + 1, 110 + 1);
        tctx.fillStyle = "#e8556a"; tctx.fillText("Carrying: Senescent RBC", 24, 110);
      }
      if (s.worldId === 3) {
        tctx.font = "18px 'VT323', monospace";
        tctx.fillStyle = "#0a0a12"; tctx.fillText("Hold \u2191/\u2193 (or W/S) on a shaft to climb", 24 + 1, 134 + 1);
        tctx.fillStyle = "rgba(244,234,208,0.7)"; tctx.fillText("Hold \u2191/\u2193 (or W/S) on a shaft to climb", 24, 134);
        const rbcLabel = "RBCs recycled: " + world.rbcsDelivered + " / " + world.rbcs.length;
        tctx.fillStyle = "#0a0a12"; tctx.fillText(rbcLabel, 24 + 1, 158 + 1);
        tctx.fillStyle = world.gate.open ? "#9fe06a" : "#e8556a"; tctx.fillText(rbcLabel, 24, 158);
      }
      if (s.worldId === "sub3") {
        if (p.carry === "marker") {
          const md = MARKER_DEFS[p.carryMeta];
          tctx.font = "22px 'VT323', monospace";
          tctx.fillStyle = "#0a0a12"; tctx.fillText("Carrying: " + md.name, 24 + 1, 110 + 1);
          tctx.fillStyle = md.color; tctx.fillText("Carrying: " + md.name, 24, 110);
        } else if (p.carry === "gcAntigen") {
          tctx.font = "22px 'VT323', monospace";
          tctx.fillStyle = "#0a0a12"; tctx.fillText("Carrying: Antigen", 24 + 1, 110 + 1);
          tctx.fillStyle = ANTIGEN_TYPES[0].color; tctx.fillText("Carrying: Antigen", 24, 110);
        }
        tctx.font = "18px 'VT323', monospace";
        const line1 = "Chamber 1 (Cytotoxic): " + world.chambers[0].progress + "/" + world.chambers[0].order.length +
          "   Chamber 2 (Helper): " + world.chambers[1].progress + "/" + world.chambers[1].order.length;
        tctx.fillStyle = "#0a0a12"; tctx.fillText(line1, 24 + 1, 134 + 1);
        tctx.fillStyle = "rgba(244,234,208,0.7)"; tctx.fillText(line1, 24, 134);
        const gcLabel = "Germinal Center: " + (world.gc.stage === "done" ? "COMPLETE" : world.gc.stage.replace("_", " "));
        tctx.fillStyle = "#0a0a12"; tctx.fillText(gcLabel, 24 + 1, 158 + 1);
        tctx.fillStyle = world.gc.stage === "done" ? "#9fe06a" : "#e8c0cf"; tctx.fillText(gcLabel, 24, 158);
      }
      if (p.shield) {
        const shieldLabel = "☉ Memory shield ready";
        tctx.font = "18px 'VT323', monospace";
        tctx.fillStyle = "#0a0a12"; tctx.fillText(shieldLabel, 24 + 1, 182 + 1);
        tctx.fillStyle = "#aef0ff"; tctx.fillText(shieldLabel, 24, 182);
      }

      // cell-lecture banner — hidden while NPC dialogue is visible
      if (s.bannerT > 0 && s.banner && s.dialogT <= 0) {
        tctx.globalAlpha = Math.min(1, s.bannerT / 30);
        tctx.textAlign = "left";
        tctx.font = "30px 'VT323', monospace";
        const maxTextW = TW - 240;
        const lines = wrapText(tctx, s.banner.text, maxTextW);
        let maxW = 0;
        for (const ln of lines) maxW = Math.max(maxW, tctx.measureText(ln).width);
        tctx.font = "16px 'Press Start 2P', monospace";
        maxW = Math.max(maxW, tctx.measureText(s.banner.name).width);
        const bw = Math.min(TW - 80, maxW + 56);
        const bh = 44 + lines.length * 30;
        const bx = (TW - bw) / 2, by = 66;
        tctx.fillStyle = "rgba(18,9,22,0.9)"; roundRect(tctx, bx, by, bw, bh, 10); tctx.fill();
        tctx.strokeStyle = "#e8859a"; tctx.lineWidth = 2; roundRect(tctx, bx, by, bw, bh, 10); tctx.stroke();
        tctx.font = "16px 'Press Start 2P', monospace"; tctx.fillStyle = "#ffb3c2";
        tctx.fillText(s.banner.name, bx + 28, by + 30);
        tctx.font = "30px 'VT323', monospace"; tctx.fillStyle = "#f6e6d6";
        lines.forEach((ln, i) => tctx.fillText(ln, bx + 28, by + 58 + i * 30));
        // countdown drain bar along bottom edge
        const barPct = Math.min(1, s.bannerT / 480);
        tctx.globalAlpha = Math.min(1, s.bannerT / 30) * 0.5;
        tctx.fillStyle = "rgba(255,255,255,0.12)"; tctx.fillRect(bx + 4, by + bh - 5, bw - 8, 3);
        tctx.fillStyle = "#e8859a"; tctx.fillRect(bx + 4, by + bh - 5, (bw - 8) * barPct, 3);
        tctx.globalAlpha = 1;
      }

      // dialog box (bottom) — the B-cell's lecture
      if (s.dialogT > 0) {
        tctx.globalAlpha = Math.min(1, s.dialogT / 30);
        tctx.textAlign = "left";
        tctx.font = "30px 'VT323', monospace";
        const bx = 40, bw = TW - 80;
        const lines = wrapText(tctx, s.dialog, bw - 56);
        const bh = 56 + lines.length * 32;
        const by = TH - bh - 24;
        tctx.fillStyle = "rgba(16,8,20,0.92)"; roundRect(tctx, bx, by, bw, bh, 12); tctx.fill();
        tctx.strokeStyle = "#82d2e2"; tctx.lineWidth = 3; roundRect(tctx, bx, by, bw, bh, 12); tctx.stroke();
        tctx.font = "20px 'Press Start 2P', monospace"; tctx.fillStyle = "#82d2e2";
        tctx.fillText(s.activeNpcName || (world.npcs ? world.npcs[0].name : world.npc.name), bx + 28, by + 34);
        tctx.font = "30px 'VT323', monospace"; tctx.fillStyle = "#f4ead0";
        lines.forEach((ln, i) => tctx.fillText(ln, bx + 28, by + 64 + i * 32));
        if (Math.floor(s.t * 2) % 2 === 0) {
          tctx.font = "18px 'VT323', monospace"; tctx.fillStyle = "rgba(244,234,208,0.45)";
          tctx.textAlign = "right"; tctx.fillText("▶ E / ENTER", bx + bw - 18, by + bh - 10);
          tctx.textAlign = "left";
        }
        tctx.globalAlpha = 1;
      }
    };

    const loop = (now) => {
      s = stateRef.current;
      let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
      if (modeRef.current === "play") { s.acc += dt; let n = 0; while (s.acc >= 1 / 60 && n < 5) { step(); s.acc -= 1 / 60; n++; } }
      else s.t += dt;
      renderGame(); renderText();
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => { cancelAnimationFrame(raf); window.removeEventListener("keydown", onDown); window.removeEventListener("keyup", onUp); };
    // eslint-disable-next-line
  }, []);

  // Music plays through the run (level, world transitions, win/lose recap)
  // and pauses on menu screens *and* the fibroblast secret scene — silence
  // sets that scene apart. Returning to play resumes it, still respecting
  // musicMuted, since play() is only ever reached via a click/keypress, which
  // satisfies browsers' autoplay-with-sound gesture requirement.
  useEffect(() => {
    const music = musicRef.current;
    if (!music) return;
    const inRun = ["play", "transition", "subtransition", "win", "lose"].includes(mode);
    if (inRun) music.play().catch(() => {});
    else music.pause();
  }, [mode]);

  useEffect(() => {
    const music = musicRef.current;
    if (!music) return;
    music.volume = volume;
    music.muted = musicMuted;
  }, [volume, musicMuted]);

  // Auto-advance from the credits scroll into the usual win/stats screen once
  // it's had time to finish; the SKIP button in the JSX below can also jump
  // straight there early.
  useEffect(() => {
    if (mode !== "credits") return;
    const timer = setTimeout(() => setModeBoth("win"), CREDITS_SCROLL_MS);
    return () => clearTimeout(timer);
    // eslint-disable-next-line
  }, [mode]);

  // Typewriter reveal for the fibroblast dialogue. isTypingRef mirrors
  // whether a line is still being typed so the canvas scene can extend the
  // character's processes while it "talks" and retract them once it's done.
  useEffect(() => {
    if (mode !== "secret") return;
    clearTimeout(secretTypeTimerRef.current);
    setSecretCharCount(0);
    isTypingRef.current = true;
    const line = secretFullText;
    let i = 0;
    const tick = () => {
      i++;
      setSecretCharCount(i);
      if (i % 2 === 0) sound("blip");
      if (i < line.length) secretTypeTimerRef.current = setTimeout(tick, 28);
      else isTypingRef.current = false;
    };
    secretTypeTimerRef.current = setTimeout(tick, 28);
    return () => { clearTimeout(secretTypeTimerRef.current); isTypingRef.current = false; };
    // eslint-disable-next-line
  }, [mode, secretLine, secretAnswer]);

  const skipSecretTyping = () => {
    clearTimeout(secretTypeTimerRef.current);
    setSecretCharCount(secretFullText.length);
    isTypingRef.current = false;
  };

  const answerSecretQuestion = (opt) => {
    sound(opt.correct ? "pickup" : "hurt");
    setSecretAnswer(opt);
  };

  const advanceSecretLine = () => {
    setSecretLine((i) => i + 1);
    setSecretAnswer(null);
  };

  // Same typewriter pattern, for the mast cell's quiz scene.
  useEffect(() => {
    if (mode !== "mastquiz") return;
    clearTimeout(mastTypeTimerRef.current);
    setMastCharCount(0);
    isTypingMastRef.current = true;
    const line = mastFullText;
    let i = 0;
    const tick = () => {
      i++;
      setMastCharCount(i);
      if (i % 2 === 0) sound("blip");
      if (i < line.length) mastTypeTimerRef.current = setTimeout(tick, 28);
      else isTypingMastRef.current = false;
    };
    mastTypeTimerRef.current = setTimeout(tick, 28);
    return () => { clearTimeout(mastTypeTimerRef.current); isTypingMastRef.current = false; };
    // eslint-disable-next-line
  }, [mode, mastLine, mastAnswer]);

  const skipMastTyping = () => {
    clearTimeout(mastTypeTimerRef.current);
    setMastCharCount(mastFullText.length);
    isTypingMastRef.current = false;
  };

  const answerMastQuestion = (opt) => {
    sound(opt.correct ? "pickup" : "hurt");
    if (opt.correct) {
      stateRef.current.atp += 5;
      setMastAtpEarned((n) => n + 5);
    }
    setMastAnswer(opt);
  };

  const advanceMastLine = () => {
    setMastLine((i) => i + 1);
    setMastAnswer(null);
  };

  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function wrapText(ctx, text, maxW) {
    const words = text.split(" "); const lines = []; let cur = "";
    for (const w of words) { const test = cur ? cur + " " + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
    if (cur) lines.push(cur); return lines;
  }
  // Small rotated arrow glyph; angle 0 points toward +x (right).
  function drawPointerArrow(ctx, x, y, angle, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    ctx.fillStyle = color; ctx.strokeStyle = "#0a0a12"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-8, 9); ctx.lineTo(-8, -9); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // Where a ray from the screen center toward (dx,dy) crosses the inset
  // screen border - used to place an off-screen objective marker.
  function edgeArrowPos(cx, cy, dx, dy, w, h, margin) {
    const halfW = w / 2 - margin, halfH = h / 2 - margin;
    const tx = dx !== 0 ? halfW / Math.abs(dx) : Infinity;
    const ty = dy !== 0 ? halfH / Math.abs(dy) : Infinity;
    const t = Math.min(tx, ty);
    return { x: cx + dx * t, y: cy + dy * t };
  }

  // Called directly from click/keypress handlers so play() runs inside the
  // same user-gesture call stack the browser's autoplay policy checks for —
  // going through the mode-watching effect alone put it one React commit
  // removed from the gesture, which some browsers silently reject.
  const playMusic = () => { const m = musicRef.current; if (m) m.play().catch(() => {}); };

  const playWorld = (n) => {
    if (!audioRef.current) { try { audioRef.current = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audioRef.current && audioRef.current.state === "suspended") audioRef.current.resume();
    reset(n); setModeBoth("play");
    playMusic();
  };
  const start = () => playWorld(1);
  const toggleMute = () => { mutedRef.current = !mutedRef.current; setMuted(mutedRef.current); };
  const toggleMusicMute = () => { musicMutedRef.current = !musicMutedRef.current; setMusicMuted(musicMutedRef.current); };
  const onVolumeChange = (v) => { volumeRef.current = v; setVolume(v); };
  const pressJump = () => { if (modeRef.current === "play") stateRef.current.player.buffer = BUFFER; };

  // On-screen touch controls: hold to move/climb, tap (twice) to jump/double-jump
  const dirBtnStyle = {
    width: 54, height: 54, borderRadius: 12, fontSize: 22, lineHeight: "54px", textAlign: "center",
    background: "rgba(244,234,208,0.16)", border: "2px solid rgba(244,234,208,0.35)", color: "#f4ead0",
    fontFamily: "'Press Start 2P', monospace", cursor: "pointer",
  };
  const jumpBtnStyle = {
    width: 86, height: 86, borderRadius: "50%", fontSize: 12,
    background: "rgba(255,211,77,0.22)", border: "2px solid rgba(255,211,77,0.5)", color: "#1a1206",
    fontFamily: "'Press Start 2P', monospace", cursor: "pointer", fontWeight: "bold",
  };
  const holdHandlers = (key) => ({

    onPointerUp: (e) => { e.preventDefault(); inputRef.current[key] = false; },

  const overlayWrap = {

    fontFamily: "'Press Start 2P', monospace", color: "#f4ead0", padding: 24,
    background: "rgba(14,6,16,0.62)",

    borderRadius: 6, padding: "14px 22px", cursor: "pointer", boxShadow: "0 5px 0 #6e4f12",
  };

    marginTop: 24, fontFamily: "'Press Start 2P', monospace", fontSize: 13, color: "#f4ead0",
    background: "rgba(20,12,24,0.5)", border: "2px solid rgba(244,234,208,0.4)",
    borderRadius: 6, padding: "14px 22px", cursor: "pointer",
  };
  const worldCard = {
    width: 230, borderRadius: 8, padding: "14px 16px", textAlign: "left",
    background: "rgba(20,12,24,0.7)", border: "2px solid rgba(244,234,208,0.25)",
    display: "flex", flexDirection: "column", gap: 8,
  };
  const cardBtn = {
    fontFamily: "'Press Start 2P', monospace", fontSize: 11, color: "#1a1206",
    background: "linear-gradient(180deg,#ffd34d,#e0a82e)", border: "2px solid #8a6418",
    borderRadius: 5, padding: "8px 12px", cursor: "pointer", alignSelf: "flex-start",
  };
  const WORLDS = [
    { id: 1, name: "Vessels & Connective Tissue", color: "#9b2c3a", desc: "Cross the bloodstream and loose connective tissue to reach an afferent lymphatic vessel." },
    { id: 2, name: "The Lymph Node", color: "#6a5cb0", desc: "Deliver antigens to follicular dendritic cells, hit HEV checkpoints, and find the efferent vessel." },
    { id: 3, name: "The Spleen", color: "#b8505f", desc: "Climb shafts between white pulp, the marginal zone, and red pulp; recycle RBCs and find the splenic vein." },
  ];
  const creditsFooter = (
    <div style={{ position: "absolute", bottom: 6, left: 10, right: 10, fontFamily: "'Press Start 2P', monospace", fontSize: 8, lineHeight: 1.8, color: "rgba(244,234,208,0.35)", textAlign: "left", pointerEvents: "none" }}>
      Curated by sovix<br />
      © 2026 @gravityeffect1 on GitHub — All rights reserved<br />
      Content adapted from Ross Histology, 7th ed.
    </div>

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, boxSizing: "border-box", background: "radial-gradient(circle at 50% 28%, #2a1020, #0a040e 72%)" }}>
      <style>{`

        .touch-controls { display: none; }

        @keyframes titleGlow {
          0%,100% { text-shadow: 0 6px 0 #2c5a1c, 0 0 22px rgba(159,224,106,0.22); }
          50%      { text-shadow: 0 6px 0 #2c5a1c, 0 0 56px rgba(159,224,106,0.65), 0 0 110px rgba(159,224,106,0.18); }
        }

          0%,46%,100% { opacity:1; }
          50%,96%     { opacity:0; }
        }
        @keyframes fadeUp {
          from { opacity:0; transform:translateY(12px); }
          to   { opacity:1; transform:translateY(0); }
        }
        .title-line { animation: fadeUp 0.55s ease both; }
        @keyframes cabinetGlow {
          0%,100% { box-shadow: 0 0 0 2px #1a0a20, 0 0 28px rgba(159,224,106,0.12), 0 18px 50px rgba(0,0,0,0.75); }
          50%     { box-shadow: 0 0 0 2px #1a0a20, 0 0 48px rgba(159,224,106,0.22), 0 18px 50px rgba(0,0,0,0.75); }
        }

        @keyframes creditsScroll {
          0%   { transform: translateY(0); }
          100% { transform: translateY(-2200px); }
        }
        .credits-scroll { animation: creditsScroll ${CREDITS_SCROLL_MS - 1500}ms linear forwards; }
      `}</style>

      <div style={{ position: "relative", width: "min(1280px, 99vw)", maxWidth: 1280 }}>
        <div className="game-bezel" style={{ position: "relative", borderRadius: 6, overflow: "hidden", border: "3px solid #3a2040", outline: "1px solid #6a3a5a" }}>
          <canvas ref={gameRef} width={VW} height={VH} style={{ width: "100%", display: "block", imageRendering: "pixelated", background: "#160a14" }} />
          <canvas ref={textRef} width={TW} height={TH} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", pointerEvents: "none" }} />
          {/* CRT scanline overlay */}
          <div style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 3, backgroundImage: "repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px)" }} />

          {/* mute toggle + menu */}
          {mode === "play" && (
            <div style={{ position: "absolute", right: 12, top: 12, display: "flex", gap: 8 }}>
              <button onClick={() => setModeBoth("worldselect")} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 10, color: "#f4ead0", background: "rgba(20,12,24,0.5)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 6, padding: "6px 8px", cursor: "pointer" }}>
                MENU
              </button>
              <button onClick={toggleMute} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 10, color: "#f4ead0", background: "rgba(20,12,24,0.5)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 6, padding: "6px 8px", cursor: "pointer" }}>
                {muted ? "SFX OFF" : "SFX ON"}
              </button>
              <button onClick={toggleMusicMute} style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 10, color: "#f4ead0", background: "rgba(20,12,24,0.5)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 6, padding: "6px 8px", cursor: "pointer" }}>
                {musicMuted ? "♫ OFF" : "♫ ON"}
              </button>
            </div>
          )}
        </div>

        {/* on-screen touch controls: D-pad (move + climb) and jump */}
        {mode === "play" && (
          <div className="touch-controls" style={{ justifyContent: "space-between", alignItems: "center", marginTop: 12, padding: "0 6px" }}>
            <div style={{ display: "grid", gridTemplateColumns: "54px 54px 54px", gridTemplateRows: "54px 54px 54px", gap: 5 }}>
              <div /><DirBtn dir="up" label="↑" /><div />
              <DirBtn dir="left" label="←" /><div /><DirBtn dir="right" label="→" />
              <div /><DirBtn dir="down" label="↓" /><div />
            </div>
            <button className="touch-btn" style={jumpBtnStyle} onPointerDown={(e) => { e.preventDefault(); pressJump(); }}>JUMP</button>
          </div>
        )}

        {mode === "title" && (
          <div style={{
            position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", textAlign: "center",
            fontFamily: "'Press Start 2P', monospace", color: "#f4ead0", padding: 24,
            background: "linear-gradient(160deg, rgba(6,2,10,0.82) 0%, rgba(14,6,16,0.26) 48%, rgba(6,2,10,0.86) 100%)",
          }}>
            <div className="title-line" style={{ fontSize: 9, color: "#7ec84a", letterSpacing: 4, animationDelay: "0s" }}>
              HISTOLOGY MADE BY GAMERS
            </div>
            <div className="title-line" style={{ fontSize: 10, color: "rgba(255,211,77,0.72)", letterSpacing: 3, marginTop: 6, animationDelay: "0.08s" }}>
              — CHAPTER II —
            </div>
            <div className="title-line" style={{ fontSize: 28, color: "#9fe06a", lineHeight: 1.25, marginTop: 16, animation: "titleGlow 3.6s ease-in-out infinite, fadeUp 0.55s 0.16s ease both", animationDelay: "titleGlow 0s, fadeUp 0.16s" }}>
              THE LYMPHATIC<br />SYSTEM
            </div>
            <div className="title-line" style={{ fontFamily: "'VT323', monospace", fontSize: 20, color: "#c8a0be", marginTop: 10, letterSpacing: 1, animationDelay: "0.24s" }}>
              a pathogen's tour of the body
            </div>
            <div className="title-line" style={{ width: 210, height: 1, background: "linear-gradient(90deg,transparent,rgba(159,224,106,0.5),transparent)", margin: "20px auto 0", animationDelay: "0.3s" }} />
            <div className="title-line" style={{ animationDelay: "0.36s" }}>
              <button style={bigBtn} onClick={start}>BEGIN INFECTION</button>
            </div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 17, color: "rgba(244,234,208,0.42)", marginTop: 8, animation: "softBlink 1.5s step-end infinite" }}>
              ▶ press any key to start ◀
            </div>
            <div className="title-line" style={{ display: "flex", gap: 12, flexWrap: "wrap", justifyContent: "center", marginTop: 4, animationDelay: "0.44s" }}>
              <button style={ghostBtn} onClick={() => setModeBoth("worldselect")}>SELECT WORLD</button>
              <button style={ghostBtn} onClick={() => setModeBoth("howtoplay")}>HOW TO PLAY</button>
              <button style={ghostBtn} onClick={() => setModeBoth("options")}>OPTIONS</button>
            </div>
            {progress.completions > 0 && (
              <div className="title-line" style={{ fontFamily: "'VT323', monospace", fontSize: 16, color: "rgba(159,224,106,0.75)", marginTop: 14, animationDelay: "0.5s" }}>
                BEST RUN: {progress.bestAtp} / {progress.bestTotal} ATP · completed {progress.completions}×
              </div>
            )}
            {creditsFooter}
          </div>
        )}
        {mode === "howtoplay" && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 10, color: "#7ec84a", letterSpacing: 3 }}>· controls ·</div>
            <div style={{ fontSize: 18, marginTop: 10, color: "#9fe06a", textShadow: "0 4px 0 #2c5a1c" }}>HOW TO PLAY</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 21, marginTop: 22, lineHeight: 2.1, color: "#e8c0cf", textAlign: "left", maxWidth: 500 }}>
              <span style={{ color: "#ffd34d" }}>MOVE</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← → &nbsp;or&nbsp; A D<br />
              <span style={{ color: "#ffd34d" }}>JUMP</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Space / W / ↑<br />
              <span style={{ color: "#ffd34d" }}>DOUBLE-JUMP</span>&nbsp;&nbsp;press jump again mid-air<br />
              <span style={{ color: "#ffd34d" }}>CLIMB SHAFT</span>&nbsp;&nbsp;hold ↑ / ↓ on a ladder column<br />
              <span style={{ color: "#ffd34d" }}>PAUSE / MENU</span>&nbsp;&nbsp;Esc
            </div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 19, marginTop: 18, lineHeight: 1.75, color: "rgba(244,234,208,0.7)", maxWidth: 480 }}>
              Pass close to immune cells to learn about them.<br />
              Carry collectibles to their delivery target to progress.<br />
              You have 3 hearts — lose them all and you respawn at<br />
              the nearest checkpoint.
            </div>
            <button style={ghostBtn} onClick={() => setModeBoth("title")}>← BACK</button>
            {creditsFooter}
          </div>
        )}
        {mode === "options" && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 11, color: "#7ec84a", letterSpacing: 2 }}>· options ·</div>
            <div style={{ fontSize: 22, marginTop: 14, color: "#9fe06a", textShadow: "0 4px 0 #2c5a1c" }}>SETTINGS</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 22, marginTop: 28, width: 340, textAlign: "left" }}>
              <div>
                <div style={{ fontSize: 12, marginBottom: 10 }}>SOUND VOLUME: {Math.round(volume * 100)}%</div>
                <input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e) => onVolumeChange(parseFloat(e.target.value))} style={{ width: "100%" }} />
              </div>
              <div>
                <div style={{ fontSize: 12, marginBottom: 10 }}>SFX (jumps, pickups, hits)</div>
                <button style={{ ...ghostBtn, marginTop: 0 }} onClick={toggleMute}>{muted ? "MUTED \u2014 CLICK TO UNMUTE" : "ON \u2014 CLICK TO MUTE"}</button>
              </div>
              <div>
                <div style={{ fontSize: 12, marginBottom: 10 }}>MUSIC</div>
                <button style={{ ...ghostBtn, marginTop: 0 }} onClick={toggleMusicMute}>{musicMuted ? "MUTED \u2014 CLICK TO UNMUTE" : "ON \u2014 CLICK TO MUTE"}</button>
              </div>
              <div style={{ paddingTop: 14, borderTop: "1px solid rgba(244,234,208,0.15)" }}>
                <div style={{ fontSize: 11, color: "#7ec84a", letterSpacing: 2, marginBottom: 8 }}>\ud83c\udfb5 SOUNDTRACK CREDITS</div>
                <div style={{ fontFamily: "'VT323', monospace", fontSize: 17, lineHeight: 1.6, color: "rgba(244,234,208,0.75)" }}>
                  Composed by Sara Sovix in <span style={{ color: "#aef0ff" }}>Strudel</span> \u2014 an ethereal ocarina-style loop generated from ubiquitin's 76-residue amino acid sequence, hydrophobicity mapped to melodic contour.
                </div>
              </div>
            </div>
            <button style={ghostBtn} onClick={() => setModeBoth("title")}>BACK</button>
            {creditsFooter}
          </div>
        )}
        {mode === "worldselect" && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 11, color: "#7ec84a", letterSpacing: 2 }}>· select a world ·</div>
            <div style={{ fontSize: 24, marginTop: 14, color: "#9fe06a", textShadow: "0 4px 0 #2c5a1c" }}>CHOOSE YOUR JOURNEY</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 18, marginTop: 8, color: "#e8c0cf" }}>
              Play any world, in any order - progress and ATP for that run start fresh.
              {progress.completions > 0 && <><br />Your best completed run is saved: {progress.bestAtp} / {progress.bestTotal} ATP · completed {progress.completions}×.</>}
            </div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center", marginTop: 18 }}>
              {WORLDS.map((w) => (
                <div key={w.id} style={worldCard}>
                  <div style={{ height: 6, borderRadius: 3, background: w.color }} />
                  <div style={{ fontSize: 11, color: "#aef0ff" }}>WORLD {w.id}</div>
                  <div style={{ fontSize: 13, color: "#f4ead0" }}>{w.name}</div>
                  <div style={{ fontFamily: "'VT323', monospace", fontSize: 17, lineHeight: 1.4, color: "#e8c0cf" }}>{w.desc}</div>
                  <button style={cardBtn} onClick={() => playWorld(w.id)}>PLAY</button>
                </div>
              ))}
            </div>
            <button style={ghostBtn} onClick={() => setModeBoth("title")}>BACK</button>
            {creditsFooter}
          </div>
        )}
        {mode === "transition" && transitionTo === 2 && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 11, color: "#aef0ff", letterSpacing: 2 }}>· entering the node ·</div>
            <div style={{ fontSize: 24, marginTop: 16, color: "#c6bdf2", textShadow: "0 4px 0 #3a3170" }}>THE LYMPH NODE</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 22, marginTop: 22, lineHeight: 1.5, color: "#e8c0cf", maxWidth: 480 }}>
              Swept along the afferent lymphatic, you pass through the capsule and drop into the subcapsular sinus.<br /><br />
              Ahead: follicles and germinal centers, the paracortex with its HEVs, the medulla — and, far beyond, the efferent lymphatic vessel.<br /><br />
              Pick up antigens and deliver them to a matching follicular dendritic cell to trigger a germinal center reaction.
            </div>
            <button style={bigBtn} onClick={beginNextWorld}>ENTER THE LYMPH NODE</button>
          </div>
        )}
        {mode === "transition" && transitionTo === 3 && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 11, color: "#ffc2cc", letterSpacing: 2 }}>· entering the spleen ·</div>
            <div style={{ fontSize: 24, marginTop: 16, color: "#e89aa6", textShadow: "0 4px 0 #7a2c3c" }}>THE SPLEEN</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 22, marginTop: 22, lineHeight: 1.5, color: "#e8c0cf", maxWidth: 480 }}>
              Out of the efferent lymphatic and into the splenic artery, you arrive in white pulp - a B-cell follicle beside the T-cell PALS, wrapped around a central arteriole.<br /><br />
              Below: the marginal zone, then red pulp's cords of Billroth - with a fork between an OPEN and a CLOSED circulation route down to the venous sinusoids and the splenic vein.<br /><br />
              Hold ↑/↓ (or W/S) on a shaft to climb between levels. Collect senescent RBCs and deliver them to the red pulp macrophage for recycling.
            </div>
            <button style={bigBtn} onClick={beginNextWorld}>ENTER THE SPLEEN</button>
          </div>
        )}
        {mode === "subtransition" && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 11, color: "#ffe9a8", letterSpacing: 2 }}>· a hidden passage ·</div>
            <div style={{ fontSize: 22, marginTop: 16, color: "#ffd34d", textShadow: "0 4px 0 #6e4f12" }}>THE FOLLICLE</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 22, marginTop: 22, lineHeight: 1.5, color: "#e8c0cf", maxWidth: 480 }}>
              Past the shimmer is where antigen presentation and B-cell activation actually happen — up close, molecule by molecule.<br /><br />
              Carry each surface marker to the right socket, in the right order: signal 1, then co-stimulation, then stabilization. Wrong marker or wrong order bounces back.<br /><br />
              Clear both T-cell pathways, then help a B cell find its T-cell helper and ride the interleukin cascade to a plasma cell and a memory cell.
            </div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center", marginTop: 18 }}>
              <button style={bigBtn} onClick={beginSubLevel}>ENTER THE FOLLICLE</button>
              <button style={ghostBtn} onClick={() => { world3StashRef.current = null; setModeBoth("play"); }}>NOT YET</button>
            </div>
          </div>
        )}
        {mode === "secret" && (
          <div style={{
            position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "flex-end", textAlign: "center",
            fontFamily: "'Press Start 2P', monospace", color: "#f4ead0", padding: 20,
          }}>
            <div style={{ position: "absolute", top: 18, fontSize: 10, color: "#f2c9b8", letterSpacing: 3, textShadow: "0 2px 0 #2a1210" }}>
              · somewhere off the map ·
            </div>
            <div style={{
              width: "min(600px, 100%)", background: "rgba(18,9,10,0.88)",
              border: "2px solid #f2c9b8", borderRadius: 10, padding: "20px 24px", textAlign: "left",
            }}>
              <div style={{ fontSize: 13, color: "#ffcbb0" }}>{secretStep.question ? "FIBROBLAST ASKS" : "FIBROBLAST"}</div>
              <div style={{ fontFamily: "'VT323', monospace", fontSize: 24, marginTop: 12, lineHeight: 1.5, color: "#f6e6d6", minHeight: "3em" }}>
                {secretFullText.slice(0, secretCharCount)}
              </div>
              {secretDoneTyping && secretStep.question && !secretAnswer ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
                  {secretStep.options.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => answerSecretQuestion(opt)}
                      style={{
                        fontFamily: "'VT323', monospace", fontSize: 19, textAlign: "left", color: "#f4ead0",
                        background: "rgba(242,201,184,0.08)", border: "1px solid rgba(242,201,184,0.4)",
                        borderRadius: 6, padding: "8px 14px", cursor: "pointer",
                      }}
                    >
                      {String.fromCharCode(65 + i)}. {opt.label}
                    </button>
                  ))}
                </div>
              ) : (
                <div style={{ marginTop: 16, textAlign: "right" }}>
                  {!secretDoneTyping ? (
                    <button style={{ ...bigBtn, marginTop: 0 }} onClick={skipSecretTyping}>SKIP ▶</button>
                  ) : secretLine < FIBROBLAST_STEPS.length - 1 ? (
                    <button style={{ ...bigBtn, marginTop: 0 }} onClick={advanceSecretLine}>NEXT ▶</button>
                  ) : (
                    <button style={{ ...bigBtn, marginTop: 0 }} onClick={() => { setModeBoth("play"); playMusic(); }}>RETURN TO SPLEEN</button>
                  )}
                </div>
              )}
            </div>
          </div>
        )}
        {mode === "mastquiz" && (
          <div style={{
            position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "flex-end", textAlign: "center",
            fontFamily: "'Press Start 2P', monospace", color: "#f4ead0", padding: 20,
          }}>
            <div style={{ position: "absolute", top: 18, fontSize: 10, color: "#f2b8dc", letterSpacing: 3, textShadow: "0 2px 0 #2a1020" }}>
              · beneath the connective tissue ·
            </div>
            {mastAtpEarned > 0 && (
              <div style={{ position: "absolute", top: 44, fontSize: 11, color: "#ffe07a", textShadow: "0 2px 0 #6e4f12" }}>
                +{mastAtpEarned} ATP earned
              </div>
            )}
            <div style={{
              width: "min(600px, 100%)", background: "rgba(18,9,16,0.88)",
              border: "2px solid #f2b8dc", borderRadius: 10, padding: "20px 24px", textAlign: "left",
            }}>
              <div style={{ fontSize: 13, color: "#ffb3dc" }}>{mastStep.question ? "MAST CELL ASKS" : "MAST CELL"}</div>
              <div style={{ fontFamily: "'VT323', monospace", fontSize: 24, marginTop: 12, lineHeight: 1.5, color: "#f6e6d6", minHeight: "3em" }}>
                {mastFullText.slice(0, mastCharCount)}
              </div>
              {mastDoneTyping && mastStep.question && !mastAnswer ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
                  {mastStep.options.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => answerMastQuestion(opt)}
                      style={{
                        fontFamily: "'VT323', monospace", fontSize: 19, textAlign: "left", color: "#f4ead0",
                        background: "rgba(242,184,220,0.08)", border: "1px solid rgba(242,184,220,0.4)",
                        borderRadius: 6, padding: "8px 14px", cursor: "pointer",
                      }}
                    >
                      {String.fromCharCode(65 + i)}. {opt.label}
                    </button>
                  ))}
                </div>
              ) : (
                <div style={{ marginTop: 16, textAlign: "right" }}>
                  {!mastDoneTyping ? (
                    <button style={{ ...bigBtn, marginTop: 0 }} onClick={skipMastTyping}>SKIP ▶</button>
                  ) : mastLine < MAST_STEPS.length - 1 ? (
                    <button style={{ ...bigBtn, marginTop: 0 }} onClick={advanceMastLine}>NEXT ▶</button>
                  ) : (
                    <button style={{ ...bigBtn, marginTop: 0 }} onClick={() => { setModeBoth("play"); playMusic(); }}>RETURN TO THE TISSUE</button>
                  )}
                </div>
              )}
            </div>
          </div>
        )}
        {mode === "credits" && (
          <div style={{ position: "absolute", inset: 0, overflow: "hidden", background: "#000" }}>
            <div className="credits-scroll" style={{ position: "absolute", left: 0, right: 0, top: "100%", padding: "0 24px" }}>
              {CREDITS_LINES.map((line, i) => {
                if (line.kind === "spacer") return <div key={i} style={{ height: 34 }} />;
                if (line.kind === "spacer2") return <div key={i} style={{ height: 64 }} />;
                if (line.kind === "title") {
                  return <div key={i} style={{ textAlign: "center", fontFamily: "'Press Start 2P', monospace", fontSize: 15, color: "#9fe06a", textShadow: "0 4px 0 #2c5a1c", letterSpacing: 1 }}>{line.text}</div>;
                }
                if (line.kind === "sub") {
                  return <div key={i} style={{ textAlign: "center", fontFamily: "'VT323', monospace", fontSize: 19, color: "#c8a0be", marginTop: 8 }}>{line.text}</div>;
                }
                if (line.kind === "label") {
                  return <div key={i} style={{ textAlign: "center", fontFamily: "'Press Start 2P', monospace", fontSize: 9, color: "#7ec84a", letterSpacing: 2 }}>{line.text}</div>;
                }
                if (line.kind === "name") {
                  return <div key={i} style={{ textAlign: "center", fontFamily: "'VT323', monospace", fontSize: 24, color: "#f4ead0", marginTop: 6 }}>{line.text}</div>;
                }
                if (line.kind === "para") {
                  return (
                    <div key={i} style={{ textAlign: "center", fontFamily: "'VT323', monospace", fontSize: 18, lineHeight: 1.7, color: "#e8c0cf", maxWidth: 460, margin: "10px auto 0" }}>
                      {line.text}
                    </div>
                  );
                }
                return <div key={i} style={{ textAlign: "center", fontFamily: "'Press Start 2P', monospace", fontSize: 8, color: "rgba(244,234,208,0.4)" }}>{line.text}</div>;
              })}
            </div>
            <button
              onClick={() => setModeBoth("win")}
              style={{
                position: "absolute", right: 14, bottom: 14, fontFamily: "'Press Start 2P', monospace", fontSize: 10,
                color: "#f4ead0", background: "rgba(244,234,208,0.12)", border: "1px solid rgba(244,234,208,0.35)",
                borderRadius: 6, padding: "8px 12px", cursor: "pointer",
              }}
            >
              SKIP ▶
            </button>
          </div>
        )}
        {mode === "win" && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 11, color: "#9fe06a", letterSpacing: 3, marginBottom: 6 }}>· pathogen survived ·</div>
            <div style={{ fontSize: 20, color: "#9fe06a", textShadow: "0 4px 0 #2c5a1c" }}>SPLENIC VEIN REACHED</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 22, marginTop: 18, lineHeight: 1.6, color: "#e8c0cf", maxWidth: 480 }}>
              You squeezed through the venous sinusoids and out via the splenic vein — back into systemic circulation. The immune system tried its best.
            </div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 20, marginTop: 14, lineHeight: 1.8, color: "#aef0ff" }}>
              ATP gathered: <span style={{ color: "#ffe07a" }}>{stats.atp}</span> / {stats.total}<br />
              Time: <span style={{ color: "#ffe07a" }}>{Math.floor(stats.time / 60) > 0 ? Math.floor(stats.time / 60) + "m " : ""}{stats.time % 60}s</span>
              {progress.completions > 0 && (
                <><br />{stats.atp >= progress.bestAtp ? <span style={{ color: "#9fe06a" }}>New best run!</span> : <>Best run: <span style={{ color: "#ffe07a" }}>{progress.bestAtp}</span> / {progress.bestTotal} ATP</>} · completed {progress.completions}×</>
              )}
            </div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 18, marginTop: 10, color: "rgba(200,180,210,0.7)", maxWidth: 440 }}>
              Bloodstream → lymph node → spleen. One pathogen's tour of adaptive immunity.
            </div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center", marginTop: 18 }}>
              <button style={bigBtn} onClick={() => playWorld(stats.worldId)}>PLAY AGAIN</button>
              <button style={ghostBtn} onClick={() => playWorld(1)}>FROM WORLD 1</button>
              <button style={ghostBtn} onClick={() => setModeBoth("worldselect")}>WORLD SELECT</button>
            </div>
          </div>
        )}
        {mode === "lose" && (
          <div style={overlayWrap}>
            <div style={{ fontSize: 10, color: "#e8556a", letterSpacing: 3, marginBottom: 8 }}>· neutralised ·</div>
            <div style={{ fontSize: 16, color: "#e8556a", textShadow: "0 4px 0 #5a1f2a" }}>THE IMMUNE</div>
            <div style={{ fontSize: 16, color: "#e8556a", textShadow: "0 4px 0 #5a1f2a" }}>RESPONSE PREVAILED</div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: 20, marginTop: 18, lineHeight: 1.9, color: "#e8c0cf", maxWidth: 440 }}>
              Phagocytosed, neutralised, or swept out of bounds.<br />
              ATP gathered: <span style={{ color: "#ffe07a" }}>{stats.atp}</span> / {stats.total}<br />
              Time survived: <span style={{ color: "#ffe07a" }}>{Math.floor(stats.time / 60) > 0 ? Math.floor(stats.time / 60) + "m " : ""}{stats.time % 60}s</span>
            </div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center", marginTop: 8 }}>
              <button style={bigBtn} onClick={() => playWorld(stats.worldId)}>TRY AGAIN</button>
              <button style={ghostBtn} onClick={() => setModeBoth("worldselect")}>WORLD SELECT</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GameCrashBoundary><MicrobeQuestV2 /></GameCrashBoundary>);
  </script>
</body>
</html>
