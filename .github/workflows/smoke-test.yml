name: Smoke test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the dev version (index.html + in-browser Babel)
      - run: npm run test:smoke
      # the precompiled itch.io build, so a release can't ship broken
      - run: npm run build
      - run: npm run test:smoke
        env:
          SMOKE_ROOT: dist
